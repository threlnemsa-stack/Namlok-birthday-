<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Namlok's 18th Birthday 🎀</title>
<style>
  *{box-sizing:border-box}
  body{
    margin:0;font-family:system-ui,-apple-system,Segoe UI,sans-serif;
    background:linear-gradient(135deg,#f7efff,#fff7fb,#f1f7ff);
    color:#4b3b55;min-height:100vh;overflow-x:hidden;
  }
  .sparkle{position:fixed;inset:0;pointer-events:none;opacity:.45;
    background-image:radial-gradient(#fff 1px,transparent 1px);
    background-size:32px 32px;
  }
  .page{max-width:900px;margin:auto;padding:28px 18px 60px;text-align:center}
  .hero{padding:45px 18px 25px}
  .tiny{letter-spacing:4px;text-transform:uppercase;font-size:12px;opacity:.7}
  h1{font-size:clamp(42px,10vw,78px);margin:10px 0 4px;
     background:linear-gradient(90deg,#8c63c7,#d77bb4,#6e8edb);
     -webkit-background-clip:text;color:transparent}
  .subtitle{font-size:18px;margin:0 auto 22px;max-width:600px}
  .countdown{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin:20px 0}
  .time{background:#ffffffaa;border:1px solid #fff;border-radius:18px;padding:10px 14px;
        min-width:72px;box-shadow:0 8px 25px #8c63c720}
  .time b{display:block;font-size:22px}.time span{font-size:11px;opacity:.65}
  .open{border:0;border-radius:999px;padding:15px 25px;font-size:16px;font-weight:700;
        cursor:pointer;background:#fff;box-shadow:0 10px 30px #8c63c730;color:#6e4e82}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(125px,1fr));gap:14px;margin-top:25px}
  .box{border:0;border-radius:22px;padding:22px 10px;background:#ffffffc7;
       box-shadow:0 8px 25px #8c63c718;cursor:pointer;min-height:145px;
       transition:.25s;position:relative;color:#5d4968;display:flex;flex-direction:column;align-items:center;justify-content:center}
  .box:hover{transform:translateY(-5px) rotate(-1deg)}
  .box.locked .gift{font-size:40px}.box.opened{background:#fff}
  .num{font-size:12px;opacity:.55}.label{font-weight:700;margin-top:8px}
  .hint{font-size:12px;opacity:.55;margin-top:5px}
  .modal{position:fixed;inset:0;background:#35283e99;display:none;align-items:center;
         justify-content:center;padding:20px;z-index:10}
  .modal.show{display:flex}
  .card{max-width:720px;width:100%;background:#fff;border-radius:30px;padding:24px;
        box-shadow:0 20px 70px #0003;animation:pop .25s ease;cursor:auto}
  @keyframes pop{from{transform:scale(.85);opacity:0}to{transform:scale(1);opacity:1}}
  .card .emoji{font-size:52px}.card h2{margin:10px 0}.card p{line-height:1.65}
  .close{margin-top:15px;border:0;border-radius:999px;padding:11px 20px;cursor:pointer;
         background:#f0e5fa;color:#5d4968;font-weight:700}
  footer{margin-top:35px;font-size:13px;opacity:.6}
  .burst{position:fixed;inset:0;pointer-events:none;z-index:20}
  .heart{position:absolute;animation:fall 1.8s ease-out forwards;font-size:22px}
  @keyframes fall{to{transform:translateY(100vh) rotate(360deg);opacity:0}}
  .btn{display:inline-block;margin-top:8px;padding:8px 12px;background:#f6e6fb;border-radius:12px;color:#6e4e82;text-decoration:none;font-weight:700;border:none;cursor:pointer}
  .card .content{max-height:60vh;overflow:auto;text-align:left}
  /* secret UI */
  .secret-form{display:flex;gap:8px;margin-top:12px;align-items:center}
  .secret-form input[type="text"]{flex:1;padding:10px;border-radius:10px;border:1px solid #eee}
  .secret-form button{padding:10px 14px;border-radius:10px;border:0;background:#8c63c7;color:#fff;font-weight:700;cursor:pointer}
  .img-row{display:flex;gap:12px;justify-content:center;align-items:center;margin-top:12px}
  .img-row img{width:120px;height:120px;object-fit:cover;border-radius:14px;box-shadow:0 8px 18px #0002}
  .success {text-align:center;font-weight:700;margin-top:10px}
  .error {color:#b02a37;margin-top:8px;font-weight:700}
  /* spotify embed container */
  .spotify-container{margin-top:12px;display:flex;flex-direction:column;align-items:center;gap:10px}
  .spotify-iframe{width:100%;max-width:660px;height:80px;border-radius:12px;border:0;overflow:hidden}
  @media(min-width:700px){ .spotify-iframe{height:380px;} }
</style>
</head>
<body>
<div class="sparkle" aria-hidden="true"></div>
<div class="page">
  <section class="hero">
    <div class="tiny">a tiny digital surprise made with love</div>
    <h1>Namlok's 18th 🎀</h1>
    <p class="subtitle">18 surprises. One very special person. Welcome to your birthday era. 💗</p>
    <div class="countdown" id="countdown" aria-hidden="false"></div>
    <button class="open" type="button" onclick="scrollToBoxes()">🎁 Open the surprise box</button>
  </section>

  <div id="boxes" class="grid" aria-live="polite" aria-label="Birthday surprises"></div>
  <footer>Made especially for Namlok • happy 18th birthday ♡</footer>
</div>

<div class="modal" id="modal" onclick="onModalOutside(event)" role="dialog" aria-modal="true" aria-labelledby="mTitle" aria-describedby="mText">
  <div class="card" id="card" onclick="event.stopPropagation()">
    <div class="emoji" id="mEmoji" aria-hidden="true"></div>
    <h2 id="mTitle"></h2>
    <div class="content"><div id="mText"></div></div>
    <div id="mExtra"></div>
    <button class="close" id="mClose" type="button" onclick="closeModal()">Close ♡</button>
  </div>
</div>

<div class="burst" id="burst" aria-hidden="true"></div>

<script>
/* --- demo MP3 URLs (replace these with your own files) --- */
const demoRmMp3 = 'https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3';
const demoGiftMp3 = 'https://www.soundhelix.com/examples/mp3/SoundHelix-Song-2.mp3';

/* --- data: surprises [emoji, title, htmlContent] --- */
const surprises = [
  ["💌","A Little Birthday Message",
    `<p>I’m really happy that I got to know you. Even though we’ve been friends for less than a year, we’ve already made so many random, funny, and special memories. 🥹</p>
     <p>I hope this new chapter brings you beautiful memories, new experiences, lots of laughter, and everything you’re wishing for. 🎂✨</p>
     <p>Happy 18th birthday! 💗 Now… go open the next box. 👀🎁</p>`],
  ["🐨","RM's Little Corner",
    `<p>Welcome to your tiny RM corner! 🐨💜</p>
     <p>Press Play now to hear a track (demo). You can replace the demo MP3s with your own files.</p>`],
  ["🐶","Martin’s Little Corner",
    `<p>Welcome to Martin’s Corner! 🐶💗</p>
     <p>So here’s your official Martin box: a tiny bit of chaos, a lot of cuteness, and maximum CORTIS vibes. 🐶🎀</p>`],
  ["🏠","Welcome to the BTS House",
    `<p>🏠 Welcome to the BTS House! 💜</p>
     <p>🛋️ Living room — for maximum chaos.<br>🍜 Kitchen — where the snacks mysteriously disappear.<br>🎤 Music room — where the playlist is always BTS.<br>🛏️ Your room — bedroo[...]
     <p>Make yourself at home and queue up your favorite songs.</p>`],
  ["😂","Our Random Conversations",
    `<p>I genuinely don't know how we can start talking about one thing and somehow end up talking about something completely different. 😭</p>
     <p>We laugh at the most random and stupid things, and somehow they're always 10x funnier when we're together. 😂</p>`],
  ["🌷","18 Little Wishes",
    `<p>💗 I wish you happiness.<br>✨ I wish you beautiful memories.<br>🎀 I wish you lots of reasons to smile.<br>🌙 I wish you peaceful nights.<br>🎧 I wish you songs that become spec[...]
     <p><b>I wish your 18th year becomes a chapter you'll always remember. 💗</b></p>`],
  ["🫶🏻","Our Little Safe Space",
    `<p>One of my favorite things about our friendship is that we can actually talk to each other. Sometimes we laugh about the most random things, and sometimes we just need to vent. No complica[...]
     <p>Thank you for being someone I can share silly moments and serious ones with. 🫶🏻</p>`],
  ["🎧","Your K-Pop Emergency Kit",
    `<p>Feeling bored? Open Spotify. 🎧<br>Feeling sad? Put on your favorite song and pretend you're in a music video. 😂</p>
     <p>Need motivation? BTS playlist. Immediately. 💜</p>`],
  ["😂","The Little Things",
    `<p>Somehow, the things we laugh about are usually the most random and pointless things ever. 😭</p>
     <p>Those tiny moments might seem insignificant, but they're honestly some of my favorite memories. 🥹💗</p>`],
  ["👑","Welcome to 18",
    `<p>Congratulations! 🎉 You have officially unlocked a brand-new level: <b>LEVEL 18</b>. 🎂</p>
     <p>Your next mission: <b>Make this year unforgettable. 🌷✨</b></p>`],
  ["🎲","Pick One!",
    `<p>You have to choose one from each pair. No cheating! 👀</p>
     <ul>
       <li>BTS concert OR Meet your favorite idol</li>
       <li>Listen to one song forever OR Never listen to music again</li>
       <li>Laugh for no reason OR Never laugh at stupid jokes again</li>
       <li>Stay up all night talking OR Wake up super early</li>
       <li>Stay home all day OR Travel somewhere new</li>
     </ul>`],
  ["📸","Memory Lane",
    `<p>We haven't known each other for that long, but somehow we've already collected so many little moments. 🥹</p>
     <p>Here's to all the memories we've already made and the ones waiting for us. 🫶🏻✨</p>`],
  ["👑","Namlok Character Card",
    `<p><b>✨ Character:</b> Namlok<br><b>🎂 Current level:</b> 18<br><b>😂 Special skill:</b> Turning the most random conversation into something hilarious.</p>`],
  ["💜","BTS Would You Rather?",
    `<p>🎤 Sing on stage with BTS OR 🎧 Spend a whole day with them behind the scenes?<br>🐨 Have a deep conversation with RM OR 🐱 Have a chaotic day with SUGA?</p>`],
  ["💗","You Deserve Good Things",
    `<p>You deserve people who appreciate you, moments that make you genuinely happy, and memories that make you smile whenever you think about them. 🌷</p>`],
  ["🔐","Secret Message", // index 15 (0-based) - requires code
    `<p>You've found the secret box. Type the secret code to unlock your special surprise.</p>`],
  ["🌟","One Last Thing...",
    `<p>You actually made it through 17 boxes. 😭🎀</p>
     <p>We started with a little birthday message and went through BTS, RM, Martin, random conversations, and memories. Now there's only <b>ONE</b> box left — the one I saved for last. 🎁💗</p>
     <p>Open it when you're ready.</p>`],
  ["🎁","UR GIFT SONG",
    `<p>We had 17 songs in the birthday playlist, but I wanted to save <b>one special playlist</b> just for you. This one is your gift. 🎧🎀</p>
     <p>Press Play now to hear a demo (replace with real MP3 to play your song).</p>`]
];

/* --- render boxes --- */
const boxes = document.getElementById('boxes');
let lastFocusedBox = null;

/* global audio manager to avoid overlapping playback */
const audioManager = {
  current: null,
  play(url, onEnd) {
    this.stop();
    const a = new Audio(url);
    a.preload = 'auto';
    a.play().catch(err => {
      console.warn('Playback failed:', err);
      alert('Playback failed — the file cannot be loaded or the browser blocked playback.');
    });
    a.onended = () => {
      if (onEnd) onEnd();
      if (this.current === a) this.current = null;
    };
    this.current = a;
    return a;
  },
  stop() {
    if (this.current) {
      try { this.current.pause(); this.current.currentTime = 0; } catch(e){}
      this.current = null;
    }
  },
  pause() {
    if (this.current) {
      try { this.current.pause(); } catch(e){}
    }
  }
};

surprises.forEach((item, i) => {
  const btn = document.createElement('button');
  btn.type = 'button';
  btn.className = 'box locked';
  btn.setAttribute('aria-expanded', 'false');
  btn.setAttribute('data-index', i);
  btn.innerHTML = `
    <div class="num">SURPRISE ${i+1}</div>
    <div class="gift">🎁</div>
    <div class="label">Locked</div>
    <div class="hint">tap to open</div>
  `;
  btn.addEventListener('click', () => openBox(i, btn));
  btn.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' || e.key === ' ') {
      e.preventDefault();
      openBox(i, btn);
    }
  });
  boxes.appendChild(btn);
});

/* --- modal elements --- */
const modal = document.getElementById('modal');
const mEmoji = document.getElementById('mEmoji');
const mTitle = document.getElementById('mTitle');
const mText = document.getElementById('mText');
const mExtra = document.getElementById('mExtra');
const mClose = document.getElementById('mClose');

/* Spotify embed helpers (kept as optional visual embeds) */
function createSpotifyEmbed(type, id) {
  const src = `https://open.spotify.com/embed/${type}/${id}`;
  const wrapper = document.createElement('div');
  wrapper.className = 'spotify-container';
  const iframe = document.createElement('iframe');
  iframe.className = 'spotify-iframe';
  iframe.setAttribute('allowtransparency','true');
  iframe.setAttribute('allow','encrypted-media; clipboard-write; autoplay; fullscreen');
  iframe.dataset.spotifySrc = src; // lazy load
  wrapper.appendChild(iframe);
  const openBtn = document.createElement('a');
  openBtn.className = 'btn';
  openBtn.textContent = 'Open in Spotify';
  openBtn.href = `https://open.spotify.com/${type}/${id}`;
  openBtn.target = '_blank';
  openBtn.rel = 'noopener';
  wrapper.appendChild(openBtn);
  return wrapper;
}

/* --- open/close modal & focus handling --- */
function openBox(index, btn) {
  // Visual change on box
  btn.classList.remove('locked');
  btn.classList.add('opened');
  btn.setAttribute('aria-expanded', 'true');
  btn.querySelector('.gift').textContent = surprises[index][0];
  btn.querySelector('.label').textContent = surprises[index][1];
  btn.querySelector('.hint').textContent = 'opened ♡';

  // default modal content
  mEmoji.textContent = surprises[index][0];
  mTitle.textContent = surprises[index][1];
  mText.innerHTML = surprises[index][2];
  mExtra.innerHTML = '';

  // Special handling: index 1 (RM) and index 17 (Gift) — add Play now buttons using HTMLAudio
  if (index === 1) {
    // Use Spotify embed for the user-provided track. Spotify does not provide a direct MP3 URL,
    // so we embed the Spotify player. The iframe requires the user to press Play inside the player
    // (browsers and Spotify disallow cross-origin autoplay). We lazy-load the embed on user click so
    // the player is available immediately inside the modal.
    const rmTrackId = '1sKsYTGy8XfHjCYqcudqG5'; // provided Spotify track ID
    const embed = createSpotifyEmbed('track', rmTrackId);
    mExtra.appendChild(embed);

    // lazy-load the iframe src now that user has interacted
    setTimeout(()=> {
      const iframe = embed.querySelector('iframe');
      if (iframe && iframe.dataset.spotifySrc) iframe.src = iframe.dataset.spotifySrc;
    }, 50);

    // Also include an "Open in Spotify" link (already added by createSpotifyEmbed) and a small hint
    const hint = document.createElement('div');
    hint.style.marginTop = '8px';
    hint.style.opacity = '.85';
    hint.style.fontSize = '13px';
    hint.textContent = 'Tip: press play inside the player to start the track.';
    mExtra.appendChild(hint);

    modal.classList.add('show');
    lastFocusedBox = btn;
    setTimeout(()=> mClose.focus(), 10);
    burst();
    return;
  }

  if (index === 2) {
    // Add Spotify embed for Martin's track (user-provided Spotify URL)
    const martinTrackId = '2fCwv2ppU5nTRTckomIGsd'; // provided track ID from the URL
    const embed = createSpotifyEmbed('track', martinTrackId);
    mExtra.appendChild(embed);

    // lazy-load the iframe src now that user has interacted
    setTimeout(()=> {
      const iframe = embed.querySelector('iframe');
      if (iframe && iframe.dataset.spotifySrc) iframe.src = iframe.dataset.spotifySrc;
    }, 50);

    const hint2 = document.createElement('div');
    hint2.style.marginTop = '8px';
    hint2.style.opacity = '.85';
    hint2.style.fontSize = '13px';
    hint2.textContent = 'Tip: press play inside the player to start the track.';
    mExtra.appendChild(hint2);

    modal.classList.add('show');
    lastFocusedBox = btn;
    setTimeout(()=> mClose.focus(), 10);
    burst();
    return;
  }

  if (index === 17) {
    // Optional Spotify embed: keeps embed behavior but we will also provide Play now
    const giftPlaylistId = '1D0gyWwW02Blz7xx5440mY';
    const embed = createSpotifyEmbed('playlist', giftPlaylistId);
    mExtra.appendChild(embed);
    setTimeout(()=> {
      const iframe = embed.querySelector('iframe');
      if (iframe && iframe.dataset.spotifySrc) iframe.src = iframe.dataset.spotifySrc;
    }, 50);

    const playBtn2 = document.createElement('button');
    playBtn2.className = 'btn';
    playBtn2.textContent = 'Play now';
    let localAudio2 = null;
    function updateLabel2() {
      playBtn2.textContent = (localAudio2 && !localAudio2.paused) ? 'Pause' : 'Play now';
    }
    playBtn2.addEventListener('click', () => {
      if (!localAudio2) {
        localAudio2 = audioManager.play(demoGiftMp3, () => { localAudio2 = null; updateLabel2(); });
        updateLabel2();
      } else if (!localAudio2.paused) {
        localAudio2.pause(); updateLabel2();
      } else {
        localAudio2.play().then(()=>updateLabel2()).catch(err=>console.warn(err));
      }
    });
    mExtra.appendChild(playBtn2);

    modal.classList.add('show');
    lastFocusedBox = btn;
    setTimeout(()=> mClose.focus(), 10);
    burst();
    return;
  }

  // secret box handling (index 15)
  if (index === 15) {
    showSecretForm();
    return;
  }

  // normal box
  modal.classList.add('show');
  lastFocusedBox = btn;
  setTimeout(() => mClose.focus(), 10);
  burst();
}

/* secret code UI */
function showSecretForm() {
  mText.innerHTML = `<p>Enter the secret code to unlock:</p>`;
  mExtra.innerHTML = `
    <div class="secret-form">
      <input id="secretInput" type="text" aria-label="Secret code" placeholder="Secret code" />
      <button id="secretSubmit" type="button">Unlock</button>
    </div>
    <div id="secretError" class="error" role="status" aria-live="polite" style="display:none"></div>
  `;
  modal.classList.add('show');
  setTimeout(()=>{
    const input = document.getElementById('secretInput');
    const submit = document.getElementById('secretSubmit');
    input.focus();
    submit.onclick = () => validateSecret(input.value.trim());
    input.onkeydown = (e) => {
      if (e.key === 'Enter') {
        e.preventDefault();
        validateSecret(input.value.trim());
      }
    };
    burst();
  },10);
}

function validateSecret(value) {
  const errorEl = document.getElementById('secretError');
  if (!value) {
    errorEl.textContent = 'Please type the code.';
    errorEl.style.display = 'block';
    return;
  }
  if (value.toUpperCase() === 'NAMLOK18') {
    showSecretSuccess();
  } else {
    errorEl.textContent = 'Wrong code — try again.';
    errorEl.style.display = 'block';
    const input = document.getElementById('secretInput');
    input.focus();
    input.select();
  }
}

function showSecretSuccess() {
  const errorEl = document.getElementById('secretError');
  if (errorEl) errorEl.style.display = 'none';

  // Replace these placeholder image URLs with your own images if desired
  const rmUrl = 'https://share.google/1EMGHwDjtekmNtsik';
  const martinUrl = 'https://share.google/ZLodWWv29hSsMdXOf';

  mEmoji.textContent = '🎉';
  mTitle.textContent = 'Secret Unlocked!';
  mText.innerHTML = `<p class="success">Secret accepted — enjoy!</p>
    <div class="img-row" aria-hidden="false">
      <div style="text-align:center">
        <img src="${rmUrl}" alt="RM (BTS)" />
        <div style="margin-top:6px;font-weight:700">RM</div>
      </div>
      <div style="text-align:center">
        <img src="${martinUrl}" alt="Martin (CORTIS)" />
        <div style="margin-top:6px;font-weight:700">Martin</div>
      </div>
    </div>
    <p style="text-align:center;font-size:28px;margin-top:10px">🎂</p>
    <p style="text-align:center">Happy 18th, Namlok! 💗</p>
  `;
  mExtra.innerHTML = '';
  setTimeout(()=> mClose.focus(), 10);
}

function closeModal() {
  modal.classList.remove('show');
  mExtra.innerHTML = '';
  // stop any playing audio when modal closes
  audioManager.stop();
  if (lastFocusedBox) lastFocusedBox.focus();
}

/* close modal when clicking backdrop */
function onModalOutside(e) {
  if (e.target === modal) closeModal();
}

/* ESC key closes modal */
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape' && modal.classList.contains('show')) {
    closeModal();
  }
});

/* --- countdown --- */
function updateCountdown() {
  const target = new Date('2026-08-19T00:00:00');
  const now = new Date(); let diff = Math.max(0, target - now);
  const d = Math.floor(diff / 86400000); diff %= 86400000;
  const h = Math.floor(diff / 3600000); diff %= 3600000;
  const m = Math.floor(diff / 60000); const s = Math.floor((diff % 60000) / 1000);
  document.getElementById('countdown').innerHTML =
    `<div class="time"><b>${d}</b><span>DAYS</span></div>
     <div class="time"><b>${h}</b><span>HOURS</span></div>
     <div class="time"><b>${m}</b><span>MIN</span></div>
     <div class="time"><b>${s}</b><span>SEC</span></div>`;
}
updateCountdown();
setInterval(updateCountdown, 1000);

/* --- burst animation --- */
function burst(){
  const el = document.getElementById('burst');
  for (let i = 0; i < 18; i++) {
    const h = document.createElement('div'); h.className = 'heart';
    h.textContent = ["💗","🎀","✨","💜","⭐"][Math.floor(Math.random()*5)];
    h.style.left = Math.random() * 100 + "vw"; h.style.top = "-30px";
    h.style.animationDelay = (Math.random() * .4) + "s"; el.appendChild(h);
    setTimeout(()=>h.remove(), 2300);
  }
}

/* convenience */
function scrollToBoxes(){ document.getElementById('boxes').scrollIntoView({behavior:'smooth'}); }
</script>
</body>
</html>
