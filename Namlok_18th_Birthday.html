<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Namlok's 18th Birthday 🎀</title>
<style>
  *{box-sizing:border-box}
  body{
    margin:0;font-family:system-ui,-apple-system,Segoe UI,sans-serif;
    background:linear-gradient(135deg,#f7efff,#fff7fb,#f1f7ff);
    color:#4b3b55;min-height:100vh;overflow-x:hidden;
  }
  .sparkle{position:fixed;inset:0;pointer-events:none;opacity:.45;
    background-image:radial-gradient(#fff 1px,transparent 1px);
    background-size:32px 32px;
  }
  .page{max-width:900px;margin:auto;padding:28px 18px 60px;text-align:center}
  .hero{padding:45px 18px 25px}
  .tiny{letter-spacing:4px;text-transform:uppercase;font-size:12px;opacity:.7}
  h1{font-size:clamp(42px,10vw,78px);margin:10px 0 4px;
     background:linear-gradient(90deg,#8c63c7,#d77bb4,#6e8edb);
     -webkit-background-clip:text;color:transparent}
  .subtitle{font-size:18px;margin:0 auto 22px;max-width:600px}
  .countdown{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin:20px 0}
  .time{background:#ffffffaa;border:1px solid #fff;border-radius:18px;padding:10px 14px;
        min-width:72px;box-shadow:0 8px 25px #8c63c720}
  .time b{display:block;font-size:22px}.time span{font-size:11px;opacity:.65}
  .open{border:0;border-radius:999px;padding:15px 25px;font-size:16px;font-weight:700;
        cursor:pointer;background:#fff;box-shadow:0 10px 30px #8c63c730;color:#6e4e82}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(125px,1fr));gap:14px;margin-top:25px}
  .box{border:0;border-radius:22px;padding:22px 10px;background:#ffffffc7;
       box-shadow:0 8px 25px #8c63c718;cursor:pointer;min-height:145px;
       transition:.25s;position:relative;color:#5d4968}
  .box:hover{transform:translateY(-5px) rotate(-1deg)}
  .box.locked .gift{font-size:40px}.box.opened{background:#fff}
  .num{font-size:12px;opacity:.55}.label{font-weight:700;margin-top:8px}
  .hint{font-size:12px;opacity:.55;margin-top:5px}
  .modal{position:fixed;inset:0;background:#35283e99;display:none;align-items:center;
         justify-content:center;padding:20px;z-index:10}
  .modal.show{display:flex}
  .card{max-width:620px;width:100%;background:#fff;border-radius:30px;padding:30px 24px;
        box-shadow:0 20px 70px #0003;animation:pop .25s ease}
  @keyframes pop{from{transform:scale(.85);opacity:0}to{transform:scale(1);opacity:1}}
  .card .emoji{font-size:52px}.card h2{margin:10px 0}.card p{line-height:1.65}
  .close{margin-top:15px;border:0;border-radius:999px;padding:11px 20px;cursor:pointer;
         background:#f0e5fa;color:#5d4968;font-weight:700}
  footer{margin-top:35px;font-size:13px;opacity:.6}
  .burst{position:fixed;inset:0;pointer-events:none;z-index:20}
  .heart{position:absolute;animation:fall 1.8s ease-out forwards;font-size:22px}
  @keyframes fall{to{transform:translateY(100vh) rotate(360deg);opacity:0}}
</style>
</head>
<body>
<div class="sparkle"></div>
<div class="page">
  <section class="hero">
    <div class="tiny">a tiny digital surprise made with love</div>
    <h1>Namlok's 18th 🎀</h1>
    <p class="subtitle">18 surprises. One very special person. Welcome to your birthday era. 💗</p>
    <div class="countdown" id="countdown"></div>
    <button class="open" onclick="scrollToBoxes()">🎁 Open the surprise box</button>
  </section>

  <div id="boxes" class="grid"></div>
  <footer>Made especially for Namlok • happy 18th birthday ♡</footer>
</div>

<div class="modal" id="modal" onclick="outside(event)">
  <div class="card">
    <div class="emoji" id="mEmoji"></div>
    <h2 id="mTitle"></h2>
    <p id="mText"></p>
    <button class="close" onclick="closeModal()">Close ♡</button>
  </div>
</div>
<div class="burst" id="burst"></div>

<script>
const surprises = [
  ["💌","Birthday Letter","Namlok, happy 18th birthday!! 🎀 I hope this new chapter brings you so many reasons to smile. I'm really lucky that our friendship exists, and I hope you always remember how special you are to me. ♡"],
  ["💜","RM Corner","Your official 18th-birthday reminder: RM would approve of this era. 😭💜 Keep being curious, thoughtful, and completely yourself."],
  ["💿","K-pop Era","If your 18th birthday were a comeback, the concept would be: cute + iconic + slightly chaotic. Your title track: 'Namlok Era'. ✨"],
  ["🎮","Roblox Quest","Birthday challenge unlocked: choose a Roblox game and make the most ridiculous outfit possible. Bonus points if it makes us laugh. 😂"],
  ["🏠","Toca Boca Room","Imagine a tiny Toca Boca room made just for you: cute bed, snacks everywhere, K-pop playing, and absolutely no responsibilities. 🎀"],
  ["🍥","Anime Energy","You officially entered your main-character era. Your mission: collect happy moments, defeat boring days, and protect your peace. ✨"],
  ["🌷","18 Things — 01","I love how you can make ordinary conversations feel special."],
  ["🫶","18 Things — 02","I appreciate every little moment we've shared, even the completely random ones."],
  ["😂","18 Things — 03","You have a talent for making me laugh at things that should NOT be that funny."],
  ["⭐","18 Things — 04","You deserve friends who celebrate you loudly and support you quietly."],
  ["🎀","18 Things — 05","Your 18th birthday deserves an entire aesthetic, obviously."],
  ["🌙","Open When Sad","If you're having a bad day: breathe, take a little break, and remember that one bad moment doesn't define your whole day. You deserve kindness, especially from yourself. 💗"],
  ["☁️","Open When Bored","Emergency boredom kit: Roblox, Toca Boca, K-pop, snacks, and sending me a completely random message. In that order. 😂"],
  ["🎲","Birthday Question","Pick one: A) spend a whole day in Roblox B) live inside an anime C) attend a K-pop concert. No cheating. 👀"],
  ["💫","18 Wishes","I hope 18 brings you new memories, good people, exciting adventures, confidence, laughter, and lots of tiny moments that make you genuinely happy."],
  ["🧸","Friendship Award","🏆 Awarded to Namlok for surviving another year of being iconic. Prize: unlimited friendship points."],
  ["🎂","Cake Break","Pause everything and imagine your dream birthday cake. Now imagine there are zero calories in this digital cake. 🍰🎀"],
  ["🎬","Final Surprise","HAPPY 18TH, NAMLOK!! 🎉💗 Thank you for being you. Here's to a new chapter full of memories we haven't made yet. Now go enjoy your birthday, birthday girl!! 🎀"]
];

const boxes = document.getElementById("boxes");
surprises.forEach((s,i)=>{
  const b=document.createElement("button");
  b.className="box locked";
  b.innerHTML=`<div class="num">SURPRISE ${i+1}</div><div class="gift">🎁</div><div class="label">Locked</div><div class="hint">tap to open</div>`;
  b.onclick=()=>openBox(i,b);
  boxes.appendChild(b);
});

function openBox(i,b){
  b.classList.remove("locked"); b.classList.add("opened");
  b.innerHTML=`<div class="num">SURPRISE ${i+1}</div><div class="gift">${surprises[i][0]}</div><div class="label">${surprises[i][1]}</div><div class="hint">opened ♡</div>`;
  document.getElementById("mEmoji").textContent=surprises[i][0];
  document.getElementById("mTitle").textContent=surprises[i][1];
  document.getElementById("mText").textContent=surprises[i][2];
  document.getElementById("modal").classList.add("show");
  burst();
}
function closeModal(){document.getElementById("modal").classList.remove("show")}
function outside(e){if(e.target.id==="modal")closeModal()}
function scrollToBoxes(){document.getElementById("boxes").scrollIntoView({behavior:"smooth"})}

function updateCountdown(){
  const target=new Date("2026-08-19T00:00:00");
  const now=new Date(); let diff=Math.max(0,target-now);
  const d=Math.floor(diff/86400000); diff%=86400000;
  const h=Math.floor(diff/3600000); diff%=3600000;
  const m=Math.floor(diff/60000); const s=Math.floor((diff%60000)/1000);
  document.getElementById("countdown").innerHTML =
    `<div class="time"><b>${d}</b><span>DAYS</span></div>
     <div class="time"><b>${h}</b><span>HOURS</span></div>
     <div class="time"><b>${m}</b><span>MIN</span></div>
     <div class="time"><b>${s}</b><span>SEC</span></div>`;
}
updateCountdown(); setInterval(updateCountdown,1000);

function burst(){
  const el=document.getElementById("burst");
  for(let i=0;i<18;i++){
    const h=document.createElement("div"); h.className="heart";
    h.textContent=["💗","🎀","✨","💜","⭐"][Math.floor(Math.random()*5)];
    h.style.left=Math.random()*100+"vw"; h.style.top="-30px";
    h.style.animationDelay=(Math.random()*.4)+"s"; el.appendChild(h);
    setTimeout(()=>h.remove(),2300);
  }
}
</script>
</body>
</html>
